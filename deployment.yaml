apiVersion: v1
kind: Namespace
metadata:
  name: log-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-monitor-sa
  namespace: log-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-monitor-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-monitor-binding
subjects:
- kind: ServiceAccount
  name: log-monitor-sa
  namespace: log-monitoring
roleRef:
  kind: ClusterRole
  name: log-monitor-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-monitor-config
  namespace: log-monitoring
data:
  DEFAULT_NAMESPACES: "default,kube-system"
  DEFAULT_DEPLOYMENTS: "all"
  ERROR_PATTERNS: "error,exception,failed,critical,fatal,panic"
  CHECK_INTERVAL: "300"
  LOG_MINUTES: "5"
  MAX_ERROR_LINES: "20"
  DEBUG: "false"
  INTERACTIVE_MODE: "true"
  API_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: log-monitoring
type: Opaque
stringData:
  webhook-url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"  # Replace with your actual webhook URL
---
apiVersion: v1
kind: Service
metadata:
  name: log-monitor-api
  namespace: log-monitoring
spec:
  selector:
    app: log-monitor
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-monitor
  namespace: log-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-monitor
  template:
    metadata:
      labels:
        app: log-monitor
    spec:
      serviceAccountName: log-monitor-sa
      containers:
      - name: log-monitor
        image: mawlstace/log-monitor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-webhook
              key: webhook-url
        envFrom:
        - configMapRef:
            name: log-monitor-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
